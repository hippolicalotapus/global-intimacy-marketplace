name: GIM fictional checkout accounts cart shipping checks
on:
  push:
    branches:
      - 'automation/gim-checkout-accounts-cart-*'
    paths:
      - 'operations/commerce/**'
      - '.github/workflows/commerce-sandbox-automation.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline-simulation:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax check mock modules
        run: |
          node --check operations/commerce/mock-customer-cart.mjs
          node --check operations/commerce/mock-customer-cart.test.mjs
          node --check operations/commerce/mock-checkout-browser.test.mjs
      - name: Offline commerce regression tests
        run: node --test $(find operations/commerce -maxdepth 1 -name '*.test.mjs' ! -name 'mock-checkout-browser.test.mjs' -print) tests/checkout-*.test.mjs
      - name: Chromium browser interactions and mobile layout
        run: |
          google-chrome --version
          mkdir -p "$RUNNER_TEMP/gim-checkout-screenshots"
          GIM_SCREENSHOT_DIR="$RUNNER_TEMP/gim-checkout-screenshots" timeout 50s node --test operations/commerce/mock-checkout-browser.test.mjs
      - name: Preserve private mobile screenshots for review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gim-fictional-checkout-mobile-screenshots
          path: ${{ runner.temp }}/gim-checkout-screenshots/*.png
          if-no-files-found: ignore
          retention-days: 1
