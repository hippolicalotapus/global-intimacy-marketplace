name: Marketplace beta checks

on:
  push:
    branches: [main, 'milestone/**']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Use Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check JavaScript syntax
        run: |
          node --check site/app.js
          node --check site/catalog.js
          node --check site/apparel.js
          node --check operations/suppliers/import-feed.mjs
          node --check operations/suppliers/*.test.mjs
          node --check operations/suppliers/publication-gates.mjs
          node --check operations/suppliers/publication-gates.test.mjs
          node --check operations/suppliers/review-queue.mjs
      - name: Unit tests and static smoke tests
        run: node --test tests/*.test.mjs operations/suppliers/*.test.mjs

