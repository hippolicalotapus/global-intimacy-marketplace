name: Commerce unit tests
on:
  push:
    branches:
      - development/commerce-foundation-20261111
      - 'automation/gim-vendor-moderation-*'
    paths:
      - 'operations/commerce/**'
      - 'tests/checkout-*.test.mjs'
      - '.github/workflows/commerce-unit-tests.yml'
  pull_request:
    paths:
      - 'operations/commerce/**'
      - 'tests/checkout-*.test.mjs'
      - '.github/workflows/commerce-unit-tests.yml'
  workflow_dispatch:
jobs:
  node-tests:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test offline commerce modules
        run: node --test operations/commerce/*.test.mjs tests/checkout-*.test.mjs
