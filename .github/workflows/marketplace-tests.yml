name: Marketplace foundation tests
on:
  push:
    branches:
      - feature/secure-checkout-foundation-20261108
    paths:
      - 'marketplace/**'
      - '.github/workflows/marketplace-tests.yml'
  pull_request:
    paths:
      - 'marketplace/**'
      - '.github/workflows/marketplace-tests.yml'
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run marketplace unit tests
        run: node --test marketplace/tests/*.test.cjs
      - name: Validate SQL migration structure
        run: |
          grep -q 'ENABLE ROW LEVEL SECURITY' marketplace/db/001_foundation.sql
          grep -q 'processor_approved' marketplace/db/001_foundation.sql
