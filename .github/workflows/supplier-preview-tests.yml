name: Supplier preview regression

on:
  push:
    paths:
      - 'site/supplier-review.html'
      - 'operations/suppliers/concorde-public-candidates.json'
      - 'tests/test_supplier_review.py'
      - '.github/workflows/supplier-preview-tests.yml'
  pull_request:
    paths:
      - 'site/supplier-review.html'
      - 'operations/suppliers/concorde-public-candidates.json'
      - 'tests/test_supplier_review.py'
      - '.github/workflows/supplier-preview-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  concorde-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Run offline Concorde preview tests
        run: python3 -m unittest discover -s tests -p 'test_supplier_review.py' -v
