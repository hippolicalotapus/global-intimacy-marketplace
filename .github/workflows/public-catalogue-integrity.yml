name: Public catalogue integrity (offline)
on:
  push:
    branches:
      - audit/catalogue-readiness-2026-11-10
    paths:
      - site/catalog.js
      - site/index.html
      - site/app.js
      - operations/catalogue/verify-public-catalogue.cjs
      - .github/workflows/public-catalogue-integrity.yml
  pull_request:
    paths:
      - site/catalog.js
      - site/index.html
      - site/app.js
      - operations/catalogue/verify-public-catalogue.cjs
      - .github/workflows/public-catalogue-integrity.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  catalogue:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check catalogue and app syntax
        run: |
          node --check site/catalog.js
          node --check site/app.js
          node --check operations/catalogue/verify-public-catalogue.cjs
      - name: Execute full public catalogue integrity checker
        run: node operations/catalogue/verify-public-catalogue.cjs
