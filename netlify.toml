# Public beta is ONLY /site. Everything under /operations stays private to the GitHub repo.
[build]
publish = "site"
command = ""

[[headers]]
for = "/*"
[headers.values]
X-Content-Type-Options = "nosniff"
Referrer-Policy = "strict-origin-when-cross-origin"
X-Frame-Options = "DENY"
Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=()"
Content-Security-Policy = "default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'none'; base-uri 'self'; form-action 'none'; frame-ancestors 'none'; object-src 'none'"
Cache-Control = "public, max-age=300"

[[headers]]
for = "/assets/*"
[headers.values]
Cache-Control = "public, max-age=86400"
