<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Checkout status | Global Intimacy Marketplace</title><style>
:root{color-scheme:dark;font:16px/1.6 system-ui,sans-serif;background:#101c23;color:#f5f5f5}
body{margin:0;min-height:100vh;display:grid;place-items:center;padding:1rem;box-sizing:border-box}
main{width:min(100%,36rem);border:1px solid #47606a;border-radius:1rem;padding:2rem;background:#1a2b35}
h1{line-height:1.2}a{color:#9fe0e2}p{max-width:55ch}
</style></head><body><main><h1 id="title">Checkout status</h1><p id="message">Please check your email for any order updates.</p><p><a href="/">Return to Global Intimacy Marketplace</a></p><small>Do not use this page as proof of payment or fulfillment. The merchant verifies payment securely before processing orders.</small></main>
<script>
(function(){var params=new URLSearchParams(location.search),status=params.get("status");
var title=document.getElementById("title"),message=document.getElementById("message");
if(status==="cancelled"){title.textContent="Checkout cancelled";message.textContent="No order has been confirmed. You may return to the store.";}
else if(status==="success"){title.textContent="Payment verification pending";message.textContent="Your checkout session has returned to the store. This does not confirm payment or an order. Wait for an independently verified confirmation from the merchant.";}
else{title.textContent="Checkout status unavailable";message.textContent="We cannot confirm a transaction from this page. Contact the merchant if you believe you were charged.";}
history.replaceState(null,"",location.pathname);
}());
</script></body></html>
